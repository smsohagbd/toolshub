name = "tootls"
compatibility_date = "2024-10-15"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "tools"
database_id = "c81800b6-11e0-4779-a37f-2bfb6a13ebaa"

# Cloudflare R2 Object Storage Binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tools-media"
preview_bucket_name = "tools-media"
